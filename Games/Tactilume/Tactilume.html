<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tactilume">
<meta name="description" content="Tactilume: touch the dark and play with a million specks of light.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff6e0'/%3E%3Cstop offset='.35' stop-color='%23ff8a1e'/%3E%3Cstop offset='1' stop-color='%23140202' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='26' fill='url(%23g)'/%3E%3C/svg%3E">
<title>Tactilume</title>
<style>
/* Tactilume: the page and every control.
   The light is the star: controls stay out of the way until asked for, then appear
   as dark glass with fine light edges. Every colour and size is a custom property;
   sizes scale with --ui-scale (the Control size setting). System fonts only, so the
   page works offline. */

/* ---- the page ------------------------------------------------------------------ */

html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body {
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior: none;
}
#stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
/* The light takes keyboard focus, so Space and the arrow keys play it. Arriving by key
   shows a soft ring that settles to a faint one; a touch or a click shows none. */
#stage:focus { outline: none; }
#stage:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.2); outline-offset: -3px; animation: tl-stage-ring 2.4s ease-out; }
@keyframes tl-stage-ring { from { outline-color: rgba(255, 255, 255, 0.8); } }
#fatal:not([hidden]) {
  position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; gap: 4px;
  padding: 24px; color: #eceef3; background: #000; text-align: center;
  font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
}
#fatal h1 { margin: 0 0 8px; font-size: 22px; font-weight: 500; letter-spacing: 0.01em; }
#fatal p { margin: 0 auto; max-width: 34em; color: #b9bdc8; }
.noscript { position: fixed; inset: 0; margin: 0; display: grid; place-content: center; color: #eceef3; font: 16px/1.5 system-ui, sans-serif; }

/* ---- tokens ---------------------------------------------------------------------- */

/* Safe areas live on :root, not #ui, so the Android app can override them with an inline
   style on <html> (some WebViews do not report display cutouts to env()). */
:root {
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
}

#ui {
  --ui-scale: 1;
  --u: calc(1px * var(--ui-scale));
  --kb: 0px;                                   /* on-screen keyboard height, set by ui.js */

  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
  --fs-2xs: calc(10.5 * var(--u));
  --fs-xs: calc(11.5 * var(--u));
  --fs-s: calc(13 * var(--u));
  --fs-m: calc(15 * var(--u));
  --fs-l: calc(17 * var(--u));
  --fs-xl: calc(20 * var(--u));
  --fs-input: max(16px, var(--fs-m));          /* below 16px, iOS zooms into a focused field */
  --fs-name: clamp(22px, 5.6vw, 34px);
  --fs-title: clamp(34px, 10vw, 96px);

  --sp-1: calc(4 * var(--u));
  --sp-2: calc(8 * var(--u));
  --sp-3: calc(12 * var(--u));
  --sp-4: calc(16 * var(--u));
  --sp-5: calc(20 * var(--u));
  --sp-6: calc(24 * var(--u));
  --sp-8: calc(32 * var(--u));

  --tap: calc(44 * var(--u));                  /* the smallest touch target */
  --hit: calc(52 * var(--u));                  /* the open button's touch target */
  --edge: calc(10 * var(--u));                 /* gap from the screen edge to floating parts */
  --gap: calc(8 * var(--u));                   /* gap around the panel */
  --icon: calc(20 * var(--u));
  --icon-s: calc(16 * var(--u));
  --thumb: calc(22 * var(--u));
  --track-h: calc(6 * var(--u));
  --switch-w: calc(50 * var(--u));
  --switch-h: calc(30 * var(--u));
  --knob: calc(26 * var(--u));

  --r-xs: calc(8 * var(--u));
  --r-s: calc(12 * var(--u));
  --r-m: calc(16 * var(--u));
  --r-l: calc(20 * var(--u));
  --r-panel: calc(28 * var(--u));
  --r-pill: 999px;

  --side-w: min(calc(384 * var(--u)), calc(100vw - 2 * var(--gap) - var(--safe-l) - var(--safe-r)));
  --sheet-max-w: calc(600 * var(--u));
  --sheet-h: min(72vh, calc(760 * var(--u)));
  --sheet-h: min(72dvh, calc(760 * var(--u)));   /* the visible height, where browsers know it */

  /* colour */
  --text: #f5f6fa;
  /* The glass lets the light through, so contrast is reckoned over the brightest it gets:
     white light behind the panel, which the glass dims to about rgb(72, 72, 76) (a little
     brighter under the sheen along the top edge). */
  --text-2: #babecb;                           /* help text: 4.9:1 there, 10.7:1 over the dark */
  --text-3: #b4b9c5;                           /* quiet labels: 4.6:1 there, 10:1 over the dark */
  --text-ink: #0b0c11;                         /* text on light buttons */
  --line: rgba(255, 255, 255, 0.09);
  --line-soft: rgba(255, 255, 255, 0.06);
  --line-2: rgba(255, 255, 255, 0.15);
  --line-strong: rgba(255, 255, 255, 0.42);
  --fill-1: rgba(255, 255, 255, 0.045);
  --fill-2: rgba(255, 255, 255, 0.085);
  --fill-3: rgba(255, 255, 255, 0.14);
  --fill-inset: rgba(0, 0, 0, 0.28);
  --hover: rgba(255, 255, 255, 0.11);
  --glass: rgba(14, 15, 21, 0.6);
  --glass-solid: #101117;
  --glass-chip: rgba(18, 19, 26, 0.5);
  --glass-edge: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0) 38%);
  --glass-blur: blur(30px) saturate(1.5) brightness(0.62);
  --glass-blur-s: blur(16px) saturate(1.4) brightness(0.7);
  --track: #2a2b34;
  --switch-off: #34353f;
  --knob-off: #c9ccd5;
  --knob-on: #ffffff;
  --seg-on: rgba(255, 255, 255, 0.14);
  --accent: #ffb347;                           /* follows the scene's palette (ui.js) */
  --accent-grad: linear-gradient(90deg, #8a1405, #d2380a, #ff7a1a, #ffb347, #ffe0a0, #fff8ec);
  --rec: #ff4747;
  --rec-glow: rgba(255, 71, 71, 0.55);
  --danger: #d23c3c;
  --danger-text: #ffc0bc;
  --danger-soft: rgba(210, 60, 60, 0.16);
  --focus: #ffffff;
  --focus-halo: rgba(0, 0, 0, 0.7);
  --veil-mid: rgba(0, 0, 0, 0.5);
  --veil-edge: rgba(0, 0, 0, 0.72);
  --veil-out: rgba(0, 0, 0, 0.2);
  --name-shadow: rgba(0, 0, 0, 0.7);
  --shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7), 0 8px 24px -8px rgba(0, 0, 0, 0.5);
  --shadow-s: 0 6px 20px -6px rgba(0, 0, 0, 0.6);
  --shine: inset 0 1px 0 rgba(255, 255, 255, 0.08);

  /* motion */
  --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
  --ease-out: cubic-bezier(0.4, 0, 0.6, 1);
  --t-fast: 160ms;
  --t: 240ms;
  --t-slow: 380ms;
}

/* ---- the root ---------------------------------------------------------------------- */

#ui {
  position: fixed; inset: 0; z-index: 1;
  pointer-events: none;                        /* the light gets every touch the controls don't */
  font-family: var(--font); font-size: var(--fs-m); line-height: 1.4; color: var(--text);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  color-scheme: dark;
}
:where(#ui) *, :where(#ui) *::before, :where(#ui) *::after { box-sizing: border-box; }
:where(#ui) [hidden] { display: none !important; }
:where(#ui) button {
  font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0;
  cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
:where(#ui) button:disabled { cursor: default; }
:where(#ui) :focus { outline: none; }
#ui :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
:where(#ui) .tl-icon { width: var(--icon); height: var(--icon); flex: none; display: block; }
.tl-sr-only {
  position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* ---- the open button ---------------------------------------------------------------- */

.tl-open {
  position: absolute; z-index: 2;
  top: calc(var(--safe-t) + var(--edge)); right: calc(var(--safe-r) + var(--edge));
  width: var(--hit); height: var(--hit);
  display: grid; place-items: center; border-radius: 50%;
  pointer-events: auto; color: var(--text);
  transition: opacity 700ms var(--ease), transform var(--t) var(--ease), visibility 0s;
}
.tl-open-glass {
  position: absolute; inset: calc(5 * var(--u)); border-radius: 50%;
  background: var(--glass-chip); border: 1px solid var(--line-2);
  -webkit-backdrop-filter: var(--glass-blur-s); backdrop-filter: var(--glass-blur-s);
  box-shadow: var(--shadow-s), var(--shine);
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease);
}
.tl-open-icon { position: relative; width: calc(22 * var(--u)); height: calc(22 * var(--u)); }
.tl-open.is-dim { opacity: 0.25; }
/* hidden controls keep the open button, faint, as the way back for one tap, a switch or a
   screen reader (photos and clips come from the canvas, so it never shows in them) */
.is-hidden .tl-open { opacity: 0.12; }
.is-hidden .tl-open:hover, .is-hidden .tl-open:focus-visible { opacity: 1; }
.tl-open:hover .tl-open-glass { background: var(--hover); border-color: var(--line-strong); }
.tl-open:active { transform: scale(0.92); }
#ui .tl-open:focus-visible { outline-offset: -2px; box-shadow: 0 0 0 4px var(--focus-halo); }
.tl-open::after {
  content: ''; position: absolute; inset: calc(5 * var(--u)); border-radius: 50%;
  border: 1.5px solid var(--accent); opacity: 0; pointer-events: none;
}
.tl-open.is-beckon::after { animation: tl-beckon 1.25s var(--ease) 2; }
@keyframes tl-beckon {
  0% { opacity: 0.9; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.9); }
}
.is-panel-open .tl-open, .is-intro .tl-open {
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity var(--t) var(--ease), visibility 0s linear var(--t);
}

/* ---- the recording badge -------------------------------------------------------------- */

.tl-rec {
  position: absolute; z-index: 2;
  top: calc(var(--safe-t) + var(--edge) + (var(--hit) - var(--tap)) / 2); left: calc(var(--safe-l) + var(--edge));
  min-height: var(--tap); padding: 0 var(--sp-4) 0 var(--sp-3);
  display: flex; align-items: center; gap: var(--sp-2);
  border-radius: var(--r-pill); pointer-events: auto;
  background: var(--glass-chip); border: 1px solid var(--line-2);
  -webkit-backdrop-filter: var(--glass-blur-s); backdrop-filter: var(--glass-blur-s);
  box-shadow: var(--shadow-s), var(--shine);
  font-size: var(--fs-s); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
}
.tl-rec-dot {
  width: calc(10 * var(--u)); height: calc(10 * var(--u)); border-radius: 50%;
  background: var(--rec); box-shadow: 0 0 0 0 var(--rec-glow);
  animation: tl-rec-pulse 1.6s ease-in-out infinite;
}
@keyframes tl-rec-pulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--rec-glow); opacity: 1; }
  50% { box-shadow: 0 0 0 calc(5 * var(--u)) transparent; opacity: 0.55; }
}
/* with the controls hidden, only a small dot says a recording is running */
.is-hidden .tl-rec {
  pointer-events: none; opacity: 0.6;
  background: transparent; border-color: transparent; box-shadow: none;
  -webkit-backdrop-filter: none; backdrop-filter: none;
}
.is-hidden .tl-rec-time { display: none; }

/* ---- the behaviour name card -------------------------------------------------------------- */

.tl-namecard-layer {
  position: absolute; z-index: 1; height: 0; pointer-events: none;
  left: calc(var(--safe-l) + var(--sp-4)); right: calc(var(--safe-r) + var(--sp-4));
  bottom: calc(var(--safe-b) + 13vh);
  transition: bottom var(--t-slow) var(--ease), right var(--t-slow) var(--ease);
}
.tl-namecard {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
  text-align: center; opacity: 0;
}
.tl-namecard-name {
  font-size: var(--fs-name); font-weight: 300; line-height: 1.1;
  letter-spacing: 0.34em; padding-left: 0.34em;  /* the tracking would push the word off centre */
  text-transform: uppercase; color: var(--text);
  text-shadow: 0 0 28px var(--name-shadow), 0 1px 3px var(--name-shadow);
}
.tl-namecard-blurb {
  max-width: 30em; font-size: var(--fs-s); line-height: 1.45; letter-spacing: 0.01em;
  color: var(--text); opacity: 0.86;
  text-shadow: 0 0 18px var(--name-shadow), 0 1px 2px var(--name-shadow);
}

/* ---- toasts -------------------------------------------------------------------------------- */

.tl-toasts {
  position: absolute; z-index: 4; pointer-events: none;
  top: calc(var(--safe-t) + var(--edge) + var(--hit) + var(--sp-2));
  left: calc(var(--safe-l) + var(--sp-4)); right: calc(var(--safe-r) + var(--sp-4));
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
  transition: right var(--t-slow) var(--ease);
}
.tl-toast {
  max-width: min(100%, calc(440 * var(--u)));
  padding: calc(10 * var(--u)) var(--sp-5);
  border-radius: var(--r-pill);
  background: var(--glass); border: 1px solid var(--line-2);
  -webkit-backdrop-filter: var(--glass-blur-s); backdrop-filter: var(--glass-blur-s);
  box-shadow: var(--shadow-s), var(--shine);
  font-size: var(--fs-s); font-weight: 500; line-height: 1.35; text-align: center;
  opacity: 0; transform: translateY(calc(-8 * var(--u))) scale(0.98);
  transition: opacity var(--t) var(--ease), transform var(--t) var(--ease);
}
.tl-toast.is-in { opacity: 1; transform: none; }
.tl-toast.is-out { opacity: 0; transform: translateY(calc(-4 * var(--u))) scale(0.98); }

/* ---- the panel ----------------------------------------------------------------------------- */

.tl-panel {
  position: absolute; z-index: 3; pointer-events: auto;
  display: flex; flex-direction: column; overflow: hidden; isolation: isolate;
  /* a floating bottom sheet first; wide screens turn it into a side sheet below */
  left: calc(var(--safe-l) + var(--gap)); right: calc(var(--safe-r) + var(--gap));
  bottom: calc(var(--safe-b) + var(--gap) + var(--kb));
  margin: 0 auto; max-width: var(--sheet-max-w);
  height: min(var(--sheet-h), calc(100% - var(--kb) - var(--safe-t) - var(--safe-b) - 4 * var(--gap)));
  border-radius: var(--r-panel);
  background: var(--glass); border: 1px solid var(--line-2);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow), var(--shine);
  transform: translate3d(0, calc(100% + var(--safe-b) + 3 * var(--gap)), 0);
  visibility: hidden;
  transition: transform var(--t-slow) var(--ease-out), visibility 0s linear var(--t-slow), bottom var(--t) var(--ease);
}
.tl-panel.is-open {
  transform: none; visibility: visible;
  transition: transform 460ms var(--ease), visibility 0s, bottom var(--t) var(--ease);
}
.tl-panel.is-dragging { transition: none; }
/* a soft sheen along the top edge, like light caught in glass */
.tl-panel-glass {
  position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: var(--glass-edge); border-radius: inherit;
}

.tl-grab { flex: none; padding: 0 var(--sp-3) 0 var(--sp-5); touch-action: none; }
.tl-handle {
  width: calc(38 * var(--u)); height: calc(5 * var(--u)); margin: var(--sp-2) auto 0;
  border-radius: var(--r-pill); background: var(--line-strong); opacity: 0.6;
}
.tl-panel-head { display: flex; align-items: center; gap: var(--sp-3); min-height: calc(56 * var(--u)); padding-top: var(--sp-1); }
.tl-panel-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(2 * var(--u)); }
.tl-eyebrow {
  font-size: var(--fs-2xs); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-3);
}
.tl-scene-name {
  font-size: var(--fs-l); font-weight: 600; letter-spacing: -0.005em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.tl-icon-btn {
  flex: none; width: var(--tap); height: var(--tap); display: grid; place-items: center;
  border-radius: 50%; background: var(--fill-2); border: 1px solid var(--line);
  color: var(--text); transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.tl-icon-btn:hover { background: var(--hover); }
.tl-icon-btn:active { transform: scale(0.94); }
.tl-icon-btn--small { background: transparent; border-color: transparent; color: var(--text-2); }

/* tabs */
.tl-tabs {
  flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(calc(46 * var(--u)), 1fr);
  gap: calc(2 * var(--u)); padding: var(--sp-1) var(--sp-2) var(--sp-2);
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line);
}
.tl-tabs::-webkit-scrollbar { display: none; }
.tl-tab {
  position: relative; min-height: calc(54 * var(--u)); padding: var(--sp-1) calc(2 * var(--u));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(4 * var(--u));
  border-radius: var(--r-m); color: var(--text-3);
  font-size: var(--fs-2xs); font-weight: 600; letter-spacing: 0.01em; white-space: nowrap;
  transition: color var(--t) var(--ease), background var(--t) var(--ease);
}
.tl-tab .tl-icon { width: calc(22 * var(--u)); height: calc(22 * var(--u)); transition: color var(--t) var(--ease), transform var(--t) var(--ease); }
.tl-tab:hover { color: var(--text-2); }
.tl-tab[aria-selected='true'] { color: var(--text); background: var(--fill-2); }
.tl-tab[aria-selected='true'] .tl-icon { color: var(--accent); transform: translateY(calc(-1 * var(--u))); }
.tl-tab[aria-selected='true']::after {
  content: ''; position: absolute; left: 34%; right: 34%; bottom: calc(3 * var(--u)); height: calc(2 * var(--u));
  border-radius: var(--r-pill); background: var(--accent-grad);
}

.tl-panel-body {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: var(--sp-1) var(--sp-4) calc(var(--sp-8) + var(--sp-2));
  -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;
}
.tl-panel-body::-webkit-scrollbar { width: calc(6 * var(--u)); }
.tl-panel-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: var(--r-pill); }
.tl-tabpanel { animation: tl-tab-in var(--t-slow) var(--ease); }
@keyframes tl-tab-in {
  from { opacity: 0; transform: translateY(calc(6 * var(--u))); }
  to { opacity: 1; transform: none; }
}

/* side sheet: wide or landscape screens (panel.js SIDE_QUERY matches this) */
@media (orientation: landscape) and (min-width: 560px), (min-width: 1000px) {
  .tl-panel {
    left: auto; margin: 0; max-width: none; width: var(--side-w); height: auto;
    top: calc(var(--safe-t) + var(--gap)); bottom: calc(var(--safe-b) + var(--gap));
    right: calc(var(--safe-r) + var(--gap));
    transform: translate3d(calc(100% + var(--safe-r) + 3 * var(--gap)), 0, 0);
  }
  .tl-grab { touch-action: auto; }
  .tl-handle { display: none; }
  .tl-panel-head { min-height: calc(64 * var(--u)); padding-top: var(--sp-2); }
  .is-panel-open .tl-namecard-layer,
  .is-panel-open .tl-toasts { right: calc(var(--safe-r) + var(--side-w) + 3 * var(--gap)); }
}
/* with a bottom sheet open, the name card rises into the light above it */
@media not all and (orientation: landscape) and (min-width: 560px) {
  .is-panel-open .tl-namecard-layer { bottom: calc(var(--safe-b) + var(--gap) + var(--sheet-h) + var(--sp-6)); }
}
@media (min-width: 1000px) {
  .is-panel-open .tl-namecard-layer { bottom: calc(var(--safe-b) + 13vh); }
}

/* ---- sections and rows ---------------------------------------------------------------------- */

.tl-section { margin-top: var(--sp-5); }
.tl-section-title {
  margin: 0 var(--sp-1) var(--sp-2); font-size: var(--fs-2xs); font-weight: 650; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-3);
}
.tl-section-note { margin: calc(-4 * var(--u)) var(--sp-1) var(--sp-2); font-size: var(--fs-s); color: var(--text-2); }
.tl-card {
  padding: calc(2 * var(--u)) var(--sp-4); border-radius: var(--r-l);
  background: var(--fill-1); border: 1px solid var(--line);
}

.tl-field { padding: var(--sp-3) 0 calc(14 * var(--u)); }

  font-size: var(--fs-s); line-height: 1.45;

/* ---- sliders ------------------------------------------------------------------------------ */

  width: var(--thumb); height: var(--thumb); border-radius: 50%; border: 0; background: var(--knob-on);
  box-shadow: 0 0 0 calc(1 * var(--u)) rgba(0, 0, 0, 0.35), 0 calc(2 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, 0.5);

/* ---- switches ---------------------------------------------------------------------------- */

/* ---- stepper ------------------------------------------------------------------------------ */

/* ---- segmented control -------------------------------------------------------------------- */

  background: var(--fill-inset); border: 1px solid var(--line);

  position: absolute; top: var(--gutter); bottom: var(--gutter); left: var(--gutter);
  width: calc((100% - 2 * var(--gutter)) / var(--n));

  border-radius: var(--r-s); background: var(--seg-on); border: 1px solid var(--line-2);

  position: relative; z-index: 1; min-height: var(--tap); padding: 0 var(--sp-1);
  border-radius: var(--r-s); color: var(--text-2);

.tl-seg .tl-opt[aria-checked='true'] { color: var(--text); }
.tl-opt-text { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Too narrow for one row (large Control size, small phone): two rows, then one, with the

  .tl-seg { grid-template-columns: minmax(0, 1fr); }
}

.tl-seg[data-fit] .tl-seg-thumb { display: none; }
.tl-seg[data-fit] .tl-opt[aria-checked='true'] { background: var(--seg-on); box-shadow: inset 0 0 0 1px var(--line-2), var(--shine); }
.tl-seg[data-fit='2'] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tl-seg[data-fit='2'] .tl-opt:last-child:nth-child(even) { grid-column: 1 / -1; }
.tl-seg[data-fit='1'] { grid-template-columns: minmax(0, 1fr); }

  position: relative; min-height: var(--tap); padding: var(--sp-2) calc(5 * var(--u));
  display: flex; align-items: center; justify-content: center; gap: calc(4 * var(--u));
  border-radius: var(--r-s); background: var(--fill-1); border: 1px solid var(--line);
  color: var(--text-2); font-size: var(--fs-s); font-weight: 600;

  margin: var(--sp-3) 0 0; padding: calc(10 * var(--u)) var(--sp-3); min-height: calc(3.6em + 20 * var(--u));
  border-radius: var(--r-s); background: var(--fill-inset); border: 1px solid var(--line-soft);

/* ---- selects (the fingers table) ------------------------------------------------------------- */

.tl-chords { display: grid; }

.tl-select-row + .tl-select-row { border-top: 1px solid var(--line-soft); }
.tl-select-wrap { position: relative; flex: none; }
.tl-select {
  min-width: calc(148 * var(--u)); min-height: var(--tap); padding: 0 calc(38 * var(--u)) 0 var(--sp-3);
  -webkit-appearance: none; appearance: none; cursor: pointer;
  font: inherit; font-size: var(--fs-m); font-weight: 500; color: var(--text);

}

.tl-select-chevron { position: absolute; right: var(--sp-3); top: 50%; width: var(--icon-s); height: var(--icon-s); margin-top: calc(-8 * var(--u)); pointer-events: none; color: var(--text-2); }

/* ---- buttons ------------------------------------------------------------------------------ */

.tl-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: var(--tap); padding: 0 var(--sp-5); border-radius: var(--r-pill);
  background: var(--fill-2); border: 1px solid var(--line-2);
  font-size: var(--fs-m); font-weight: 600; letter-spacing: 0.005em; color: var(--text);
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.tl-btn .tl-icon { width: calc(18 * var(--u)); height: calc(18 * var(--u)); }
.tl-btn:hover { background: var(--hover); border-color: var(--line-strong); }
.tl-btn:active { transform: scale(0.97); }
.tl-btn--primary { background: var(--text); color: var(--text-ink); border-color: transparent; }
.tl-btn--primary:hover { background: #fff; }
.tl-btn--quiet { background: transparent; border-color: transparent; color: var(--text-2); padding: 0 var(--sp-3); }
.tl-btn--quiet:hover { background: var(--fill-2); color: var(--text); }
.tl-btn--danger { background: var(--danger); border-color: transparent; color: #fff; }
.tl-actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); margin-top: var(--sp-3); }
.tl-actions-row .tl-btn { width: 100%; padding: 0 var(--sp-3); }

.tl-confirm-ask { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-2) var(--sp-3); }
.tl-confirm-q { font-size: var(--fs-s); color: var(--text); font-weight: 500; }
.tl-confirm-actions { display: flex; gap: var(--sp-2); margin-left: auto; }

/* ---- scenes tab ---------------------------------------------------------------------------- */

/* two cards across on a phone, more on a wide sheet, one when the controls are made large */
.tl-presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, calc(150 * var(--u))), 1fr)); gap: calc(10 * var(--u)); }

  position: relative; display: flex; flex-direction: column; overflow: hidden; text-align: left;
  border-radius: var(--r-m); background: var(--fill-1); border: 1px solid var(--line);
  transition: border-color var(--t) var(--ease), transform var(--t-fast) var(--ease), background var(--t) var(--ease);

.tl-preset-strip { display: block; height: calc(2 * var(--u)); opacity: 0.85; }
.tl-preset-text { display: flex; flex-direction: column; gap: calc(3 * var(--u)); padding: calc(10 * var(--u)) var(--sp-3) var(--sp-3); }
.tl-preset-name { font-size: var(--fs-m); font-weight: 600; letter-spacing: -0.005em; }
.tl-preset-blurb {
  font-size: var(--fs-xs); line-height: 1.4; color: var(--text-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.tl-preset-badge {
  position: absolute; top: var(--sp-2); left: var(--sp-2); display: none; align-items: center; gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(9 * var(--u)) calc(3 * var(--u)) calc(7 * var(--u)); border-radius: var(--r-pill);
  background: rgba(0, 0, 0, 0.6); color: #fff;
  font-size: var(--fs-2xs); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
}
.tl-preset-badge::before { content: ''; width: calc(6 * var(--u)); height: calc(6 * var(--u)); border-radius: 50%; background: var(--accent); }
.tl-preset[aria-current='true'] { border-color: var(--line-strong); box-shadow: 0 0 0 1px var(--line-strong); }
.tl-preset[aria-current='true'] .tl-preset-badge { display: inline-flex; }

.tl-save { padding: var(--sp-3) 0 var(--sp-3); }
.tl-save-row { display: flex; gap: var(--sp-2); margin-top: var(--sp-2); }
.tl-text {
  flex: 1; min-width: 0; min-height: var(--tap); padding: 0 var(--sp-3); margin: 0;
  font: inherit; font-size: var(--fs-input); color: var(--text);
  border-radius: var(--r-s); background: var(--fill-inset); border: 1px solid var(--line-2);
  user-select: text; -webkit-user-select: text;

.tl-user-list { list-style: none; margin: 0; padding: 0 0 var(--sp-1); }
.tl-user { border-top: 1px solid var(--line-soft); }
.tl-user-main { display: flex; align-items: center; gap: var(--sp-1); }
.tl-user-load {
  flex: 1; min-width: 0; min-height: calc(54 * var(--u)); display: flex; align-items: center; gap: var(--sp-3);
  text-align: left; border-radius: var(--r-s); padding: 0 var(--sp-1); margin-left: calc(-4 * var(--u));
}
.tl-user-load:hover { background: var(--fill-1); }
.tl-user-swatch {
  flex: none; width: calc(30 * var(--u)); height: calc(30 * var(--u)); border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
}
.tl-user-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.tl-user-date { flex: none; font-size: var(--fs-s); color: var(--text-3); }
.tl-user.is-asking .tl-user-main { opacity: 0.5; }
.tl-user-ask { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); padding: 0 0 var(--sp-3); }
.tl-empty { padding: var(--sp-3) 0 var(--sp-2); font-size: var(--fs-s); color: var(--text-2); }

/* ---- sound tab ---------------------------------------------------------------------------- */

.tl-song {
  display: flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-3);
  padding: calc(6 * var(--u)) calc(6 * var(--u)) calc(6 * var(--u)) var(--sp-3);
  border-radius: var(--r-m); background: var(--fill-2); border: 1px solid var(--line);
}
.tl-song-icon { color: var(--accent); }
.tl-song-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tl-song-eyebrow { font-size: var(--fs-2xs); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); }
.tl-song-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

/* ---- capture tab ---------------------------------------------------------------------------- */

.tl-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: calc(10 * var(--u)); }
.tl-tile {
  position: relative; overflow: hidden; min-height: calc(156 * var(--u)); padding: var(--sp-4);
  display: flex; flex-direction: column; align-items: flex-start; text-align: left;
  border-radius: var(--r-l); background: var(--fill-1); border: 1px solid var(--line);
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease), transform var(--t-fast) var(--ease);
}
.tl-tile::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.18;
  background: radial-gradient(120% 80% at 0% 0%, var(--accent), transparent 60%);
  transition: opacity var(--t) var(--ease);
}
.tl-tile:hover { background: var(--fill-2); border-color: var(--line-2); }
.tl-tile:hover::before { opacity: 0.28; }
.tl-tile:active { transform: scale(0.98); }
.tl-tile:disabled { opacity: 0.6; }
.tl-tile-icon {
  position: relative; width: calc(48 * var(--u)); height: calc(48 * var(--u));
  display: grid; place-items: center; border-radius: 50%;
  background: var(--fill-3); border: 1px solid var(--line-2);
}
.tl-tile-icon .tl-icon { width: calc(24 * var(--u)); height: calc(24 * var(--u)); grid-area: 1 / 1; }

.tl-tile.is-recording .tl-tile-icon .tl-icon--stop { display: block; }
.tl-tile-title { position: relative; margin-top: var(--sp-5); font-size: var(--fs-l); font-weight: 650; }
.tl-tile-sub { position: relative; margin-top: calc(2 * var(--u)); font-size: var(--fs-s); line-height: 1.35; color: var(--text-2); font-variant-numeric: tabular-nums; }
.tl-tile.is-recording { border-color: var(--rec); }
.tl-tile.is-recording::before { background: radial-gradient(120% 80% at 0% 0%, var(--rec), transparent 60%); opacity: 0.3; }
.tl-tile.is-recording .tl-tile-icon { background: var(--rec); border-color: transparent; color: #fff; animation: tl-rec-pulse 1.6s ease-in-out infinite; }

/* ---- settings tab ------------------------------------------------------------------------- */

  var common_default = "// ---- shared by the simulation and the point renderer --------------------------\n\nconst float TAU = 6.28318530718;\n\n// NaN or infinity, tested on the bits. Phone GPU compilers may treat isnan()/isinf() as\n// always false (fast math), so a NaN would slip past them and black out the screen.\nbool badf(float x) { return (floatBitsToUint(x) & 0x7f800000u) == 0x7f800000u; }\nbool bad3(vec3 v) { return badf(v.x) || badf(v.y) || badf(v.z); }\n\n// PCG3D (Jarzynski & Olano 2020): good, fast integer hashing on any GPU.\nuvec3 pcg3d(uvec3 v) {\n  v = v * 1664525u + 1013904223u;\n  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;\n  v ^= v >> 16u;\n  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;\n  return v;\n}\n\n// Four fixed random numbers in 0..1 for particle `i`, the same every frame.\nvec4 seeds(uint i) {\n  uvec3 a = pcg3d(uvec3(i, 0x9e3779b9u, 0x85ebca6bu));\n  uvec3 b = pcg3d(uvec3(a.x ^ i, 0xc2b2ae35u, 0x27d4eb2fu));\n  return vec4(vec3(a), float(b.x)) * (1.0 / 4294967295.0);\n}\n\n// Three more fixed numbers per particle, roughly bell-shaped around 0 (-1.5..1.5),\n// independent of seeds(): for offsets that should look organic, not gridded.\nvec3 bellSeeds(uint i) {\n  uvec3 a = pcg3d(uvec3(i, 0x165667b1u, 0xd3a2646cu));\n  uvec3 b = pcg3d(a ^ uvec3(0xfd7046c5u, 0xb55a4f09u, i));\n  vec3 u = vec3(a) * (1.0 / 4294967295.0);\n  vec3 v = vec3(b) * (1.0 / 4294967295.0);\n  vec3 w = vec3(pcg3d(b + i)) * (1.0 / 4294967295.0);\n  return u + v + w - 1.5;\n}\n\n// Three random numbers in 0..1 that change with `salt` (for example the frame number).\nvec3 rand3(uint i, uint salt) {\n  return vec3(pcg3d(uvec3(i, salt, i ^ (salt * 747796405u)))) * (1.0 / 4294967295.0);\n}\n\n// Arnold-Beltrami-Childress flow in two octaves: divergence-free (so the light\n// never bunches up or thins out on its own), smooth and endlessly varied.\n// The second octave is evaluated in rotated coordinates and rotated back, which\n// keeps it divergence-free because the rotation is orthonormal.\nconst mat3 ROT = mat3(0.8, 0.6, 0.0, -0.48, 0.64, 0.6, 0.36, -0.48, 0.8);\nvec3 abcFlow(vec3 p, float t) {\n  vec3 q = p * 2.1 + vec3(0.31 * t, -0.23 * t, 0.17 * t);\n  vec3 u = vec3(sin(q.z) + cos(q.y), sin(q.x) + cos(q.z), sin(q.y) + cos(q.x));\n  vec3 r = ROT * p * 4.3 + vec3(-0.13 * t, 0.29 * t, 0.11 * t);\n  vec3 w = vec3(sin(r.z) + cos(r.y), sin(r.x) + cos(r.z), sin(r.y) + cos(r.x));\n  return u * 0.62 + (transpose(ROT) * w) * 0.3;\n}\n";

  // src/js/gfx/shaders/sim.vert.glsl
  var sim_vert_default = "#version 300 es\n// One step of the particle simulation. Runs once per particle with rasterisation\n// off; transform feedback writes vPos/vVel into the other buffer.\nprecision highp float;\nprecision highp int;\n\nlayout(location = 0) in vec4 aPos;   // xyz position, w heat (how lit-up it is)\nlayout(location = 1) in vec4 aVel;   // xyz velocity, w life (fountain only)\n\nout vec4 vPos;\nout vec4 vVel;\n\n#include common\n\n#define MAX_POLES 32\nuniform vec4 uPole[MAX_POLES];    // x, y, weight (power with fade), age\nuniform vec4 uPoleV[MAX_POLES];   // vx, vy, raw power, spin sign\nuniform int uPoleCount;\nuniform vec4 uPulse[8];           // x, y, power, age   (age >= 9 means unused)\nuniform vec4 uRelease[4];         // x, y, charge, age  (charge 0 means unused)\nuniform int uBehA;\nuniform int uBehB;\nuniform float uMix;               // 0 = all A, 1 = all B\nuniform float uDt;\nuniform float uTime;\nuniform uint uFrame;\nuniform float uStrength;\nuniform float uDrag;\nuniform float uFlow;\nuniform float uDepth;\nuniform float uTouch;             // 0..1, how much anyone is touching right now\nuniform float uEngage;            // like uTouch but lets go slowly\nuniform int uForm;\nuniform vec3 uGravity;            // acceleration, already scaled\nuniform float uAspect;\nuniform vec4 uAudio;              // level, bass, mid, high\nuniform float uOnset;\nuniform int uInit;                // 1: place every particle in the resting shape\n\n// Behaviour ids, as in core/behaviours.js\n#define B_WELL 0\n#define B_WHIRL 1\n#define B_BURST 2\n#define B_HALO 3\n#define B_CURRENT 4\n#define B_WEAVE 5\n#define B_CHIME 6\n#define B_STORM 7\n#define B_LATTICE 8\n#define B_NOVA 9\n#define B_MURMUR 10\n#define B_FOUNTAIN 11\n\n// Forms, as in core/scene.js FORMS\n#define F_NEBULA 0\n#define F_DISC 1\n#define F_SHELL 2\n#define F_RING 3\n#define F_LATTICE 4\n#define F_NONE 5\n\nvec3 poleAt(int i) { return vec3(uPole[i].xy, 0.0); }\n\n// A point on the lattice: glowing grid lines. Each particle sits on one line.\nvec3 latticeHome(vec4 s) {\n  float sp = 0.25;\n  float ax = uAspect * 1.05;\n  float dz = 0.15 + uDepth * 0.75;\n  int fam = int(s.w * (uDepth > 0.15 ? 3.0 : 2.0));\n  float nx = floor(ax / sp), ny = floor(1.05 / sp), nz = max(1.0, floor(dz / sp));\n  float gx = (floor(s.y * (2.0 * nx + 1.0)) - nx) * sp;\n  float gy = (floor(s.z * (2.0 * ny + 1.0)) - ny) * sp;\n  float gz = (floor(s.z * (2.0 * nz + 1.0)) - nz) * sp;\n  float gz2 = (floor(s.y * (2.0 * nz + 1.0)) - nz) * sp;\n  float u = s.x * 2.0 - 1.0;\n  if (fam == 0) return vec3(u * ax, gy, gz2 * uDepth);\n  if (fam == 1) return vec3(gx, u * 1.05, gz * uDepth);\n  return vec3(gx, gy, u * dz);\n}\n\n// Where a particle rests in each shape. The shapes turn slowly, so the targets move.\nvec3 formTarget(int form, vec4 s, float t) {\n  float R = min(uAspect, 1.0) * 0.86;\n  if (form == F_DISC) {\n    float r = 0.06 + 0.94 * sqrt(s.x);\n    float a = s.y * TAU + t * 0.32 / (0.22 + r);\n    // two soft spiral arms\n    r *= 1.0 + 0.07 * sin(2.0 * a - 7.0 * r);\n    float z = (s.z - 0.5) * 0.16 * uDepth * (1.0 - 0.7 * r);\n    // a little wider than tall on wide screens, so the disc fills them\n    return vec3(cos(a) * r * R * clamp(uAspect, 1.0, 1.35), sin(a) * r * R, z);\n  }\n  if (form == F_SHELL) {\n    float z = s.x * 2.0 - 1.0;\n    float a = s.y * TAU + t * 0.12;\n    float rr = sqrt(1.0 - z * z);\n    vec3 p = vec3(cos(a) * rr, z, sin(a) * rr) * R * 0.92;\n    p.z *= uDepth;\n    return p + (s.zwx - 0.5) * 0.02;\n  }\n  if (form == F_RING) {\n    float a = s.x * TAU + t * 0.18;\n    float b = s.y * TAU;\n    float minor = 0.05 + 0.04 * s.z;\n    vec3 p = vec3(cos(a) * (R + minor * cos(b)), sin(a) * (R + minor * cos(b)), minor * sin(b));\n    float tilt = uDepth * 1.05;\n    float c = cos(tilt), sn = sin(tilt);\n    p = vec3(p.x, p.y * c - p.z * sn, p.y * sn + p.z * c);\n    return p;\n  }\n  if (form == F_LATTICE) return latticeHome(s);\n  // nebula and none: a soft cloud\n  float r1 = sqrt(-2.0 * log(max(s.x, 1e-6)));\n  vec3 g = vec3(r1 * cos(TAU * s.y), r1 * sin(TAU * s.y), (s.z - 0.5) * 2.4);\n  return g * vec3(uAspect * 0.34, 0.34, 0.32 * uDepth);\n}\n\n// ---------------------------------------------------------------------------------\n// The behaviours. Each returns an acceleration and adds to `heat` (how bright it gets).\n\nvec3 bWell(vec3 p, vec3 v, inout float heat) {\n  vec3 acc = vec3(0.0);\n  for (int i = 0; i < uPoleCount; i++) {\n    float w = uPole[i].z;\n    vec3 d = poleAt(i) - p;\n    float r2 = dot(d, d) + 0.0025;\n    float r = sqrt(r2);\n    acc += d / r * min(w * 0.6 / r2, 45.0);\n    // a sideways pull, so the light settles into discs instead of falling straight through\n    acc += vec3(-d.y, d.x, 0.0) / r * w * 0.85 * uPoleV[i].w / (r + 0.14);\n    // a soft core keeps the centre from collapsing to a single point\n    acc -= d / r * w * 26.0 * exp(-r2 * 700.0);\n    heat += w * 0.9 * exp(-r2 * 34.0);\n  }\n  return acc;\n}\n\nvec3 bWhirl(vec3 p, vec3 v, inout float heat) {\n  vec3 field = vec3(0.0);\n  float wsum = 0.0;\n  for (int i = 0; i < uPoleCount; i++) {\n    float w = uPole[i].z;\n    vec3 d = poleAt(i) - p;\n    float r2 = dot(d.xy, d.xy) + 0.004;\n    float r = sqrt(r2);\n    // a solid core that turns into a 1/r swirl outside: neighbouring touches turn opposite ways\n    float sign = (i % 2 == 0) ? 1.0 : -1.0;\n    vec3 t = vec3(-d.y, d.x, 0.0) / r * (w * 1.7 * r / (r2 + 0.045)) * sign;\n    t += d * w * 0.4 / (r + 0.35);\n    t.z += sin(r * 13.0 - uTime * 2.2 + float(i)) * 0.22 * w * uDepth;\n    float f = exp(-r * 1.1);\n    field += t * f;\n    wsum += f * w;\n    heat += w * 0.9 * exp(-r2 * 10.0);\n  }\n  return (field - v * min(wsum, 1.0)) * 2.6;\n}\n\nvec3 bBurst(vec3 p, vec3 v, inout float heat) {\n  vec3 acc = vec3(0.0);\n  for (int i = 0; i < uPoleCount; i++) {\n    float w = uPole[i].z;\n    vec3 d = p - poleAt(i);\n    float r2 = dot(d, d) + 0.003;\n    float r = sqrt(r2);\n    vec3 n = d / r;\n    // a short-range push keeps a clear space around the touch\n    acc += n * w * 0.3 / (r2 + 0.04) * exp(-r * 1.5);\n    // rings go out every 0.9 s while held, the first one at touch-down\n    float ph = mod(uPole[i].w, 0.9);\n    float R = ph * 1.5;\n    // (a square, never pow(x, 2.0): pow is undefined for negative x and NaN on phone GPUs)\n    float off = (length(d.xy) - R) / 0.04;\n    float band = exp(-off * off) * (1.0 - ph / 0.9);\n    acc += n * band * w * 14.0;\n    heat += band * w * 3.0;\n    // and the light drifts back in between rings\n    acc -= n * w * 0.35 * smoothstep(0.25, 1.2, r);\n  }\n  return acc;\n}\n\nvec3 bHalo(vec3 p, vec3 v, vec4 s, inout float heat) {\n  // Each particle belongs to one touch's halo. (Pulling toward every ring at once\n  // would trap the light at the balance point between two touches.)\n  int i = min(int(s.y * float(uPoleCount)), uPoleCount - 1);\n  float w = uPole[i].z;\n  vec3 d = p - poleAt(i);\n  float r = length(d) + 1e-4;\n  vec3 n = d / r;\n  // rings within the ring: each particle keeps to its own shell\n  float R0 = (0.15 + 0.06 * uPoleV[i].z) * (0.8 + 0.4 * s.z) + 0.025 * sin(uPole[i].w * 2.3 + float(i));\n  vec3 acc = -n * (r - R0) * 14.0 * w;\n  acc += vec3(-n.y, n.x, 0.0) * (0.9 + 0.8 * s.x) * w * uPoleV[i].w;\n  acc -= v * 1.5 * w;\n  heat += w * (0.25 + exp(-abs(r - R0) * 24.0) * 1.1);\n  return acc;\n}\n\n// closest point on segment a-b to p, and the segment direction\nvec3 closestOnSegment(vec3 p, vec3 a, vec3 b, out vec3 dir, out float t) {\n  vec3 ab = b - a;\n  float L2 = max(dot(ab, ab), 1e-6);\n  t = clamp(dot(p - a, ab) / L2, 0.0, 1.0);\n  dir = ab * inversesqrt(L2);\n  return a + ab * t;\n}\n\nvec3 bCurrent(vec3 p, vec3 v, vec4 s, inout float heat) {\n  int n = uPoleCount;\n  if (s.w > 0.8) return vec3(0.0);   // some light stays loose, as atmosphere\n  // each particle swims in its own lane, so the river has width and grain\n  vec3 lane3 = bellSeeds(uint(gl_VertexID)) * 0.045;\n  if (n == 1) {\n    // one touch: a circular river around it\n    float w = uPole[0].z;\n    vec3 d = p - poleAt(0);\n    float r = length(d.xy) + 1e-3;\n    vec3 tang = vec3(-d.y, d.x, 0.0) / r;\n    vec3 target = tang * 1.3 - d / r * (r - 0.32) * 3.0;\n    target.z = -p.z * 1.5;\n    float f = w * exp(-abs(r - 0.32) * 3.0);\n    heat += f * 0.8;\n    return (target - v) * 2.4 * f;\n  }\n  vec3 field = vec3(0.0);\n  float wsum = 0.0;\n  vec3 pull = vec3(0.0);\n  for (int i = 0; i < n; i++) {\n    int j = (i + 1) % n;\n    vec3 a = poleAt(i), b = poleAt(j);\n    // with two touches the river runs out on one side and back on the other\n    if (n == 2) {\n      vec3 ab = b - a;\n      vec3 side = normalize(vec3(-ab.y, ab.x, 0.0) + 1e-5) * 0.08;\n      a += side; b += side;\n    }\n    vec3 dir; float t;\n    vec3 c = closestOnSegment(p, a, b, dir, t);\n    vec3 side = vec3(-dir.y, dir.x, 0.0);\n    c += side * lane3.x + vec3(0.0, 0.0, lane3.y * uDepth);\n    vec3 dd = p - c;\n    float dist2 = dot(dd, dd);\n    float w = min(uPole[i].z, uPole[j].z);\n    float f = exp(-dist2 / 0.03) * w;\n    // faster in the middle of the stream than at its banks\n    field += dir * (1.1 + 0.7 * exp(-lane3.x * lane3.x * 600.0)) * f;\n    wsum += f;\n    pull += -dd / (sqrt(dist2) + 0.05) * 0.7 * exp(-dist2 / 0.2) * w;\n    heat += f * 0.8;\n  }\n  return (field - v * min(wsum, 1.0)) * 2.6 + pull;\n}\n\nvec3 bWeave(vec3 p, vec3 v, vec4 s, inout float heat) {\n  int n = uPoleCount;\n  if (s.w > 0.72) return vec3(0.0);   // some light stays loose, as atmosphere\n  if (n == 1) {\n    float w = uPole[0].z;\n    float a = s.x * TAU + uTime * 0.6;\n    vec3 target = poleAt(0) + vec3(cos(a), sin(a), sin(a * 2.0 + s.y * TAU) * 0.3 * uDepth) * (0.22 + 0.02 * sin(a * 5.0 + uTime * 3.0));\n    heat += w * 0.4;\n    return ((target - p) * 16.0 - v * 3.0) * w;\n  }\n  // threads: each touch to the next, and (from 4 touches) to the one after that too\n  int segs = n == 2 ? 1 : (n == 3 ? 3 : 2 * n);\n  int k = min(int(s.x * float(segs)), segs - 1);\n  int i = k < n ? k : k - n;\n  int j = k < n ? (i + 1) % n : (i + 2) % n;\n  vec3 a = poleAt(i), b = poleAt(j);\n  vec3 ab = b - a;\n  float L = length(ab) + 1e-4;\n  vec3 side = vec3(-ab.y, ab.x, 0.0) / L;\n  float tp = fract(s.y + uTime * 0.04 * (s.z - 0.5));\n  // the thread vibrates like a plucked string, in its own harmonic\n  float harmonic = float(1 + k % 3);\n  float vib = sin(3.14159 * tp * harmonic) * sin(uTime * (3.0 + harmonic * 1.7) + float(k)) * 0.05 * min(L, 1.0);\n  vec2 jit = (s.zw - 0.5) * 0.022;\n  vec3 target = a + ab * tp + side * (jit.x + vib) + vec3(0.0, 0.0, jit.y + vib * 0.8 * uDepth);\n  float w = min(uPole[i].z, uPole[j].z);\n  heat += w * 0.55;\n  return ((target - p) * 20.0 - v * 3.2) * w;\n}\n\nvec3 bChime(vec3 p, vec3 v, uint id, inout float heat) {\n  // the touches ring like bells; light gathers on the still lines between the waves\n  float F = 0.0;\n  vec3 G = vec3(0.0);\n  float k = 15.0;\n  for (int i = 0; i < uPoleCount; i++) {\n    float w = uPole[i].z;\n    vec3 d = p - poleAt(i);\n    float r = length(d.xy) + 1e-4;\n    float ph = k * r - 3.2 * uPole[i].w;\n    float fall = exp(-r * 0.9);\n    F += w * sin(ph) * fall;\n    G += w * (k * cos(ph) - 0.9 * sin(ph)) * fall * vec3(d.xy / r, 0.0);\n  }\n  vec3 acc = -F * G * 0.1;\n  acc.z -= p.z * 5.0 * (1.0 - 0.6 * uDepth);\n  // shaken off the moving parts of the plate, like sand\n  vec3 shake = rand3(id, uFrame) - 0.5;\n  acc += shake * abs(F) * 3.5;\n  heat += abs(F) * 0.25 + 0.15 * float(uPoleCount > 0);\n  return acc - v * 1.2;\n}\n\nvec3 bStorm(vec3 p, vec3 v, inout float heat) {\n  float near = 0.0;\n  vec3 gust = vec3(0.0);\n  vec3 swirl = vec3(0.0);\n  for (int i = 0; i < uPoleCount; i++) {\n    float w = uPole[i].z;\n    vec3 d = p - poleAt(i);\n    float r2 = dot(d.xy, d.xy);\n    float e = exp(-r2 / 0.22);\n    near += w * e;\n    // a flick throws the air along with it\n    gust += vec3(uPoleV[i].xy           blend.mix = 0;
          const b = behaviourByKey(target);
          if (settings.hints) ui.showBehaviour(b, { autopilot: autoShown });
          audio.behaviourChanged(target);
        }
      }
      blend.mix = Math.min(1, blend.mix + dt / 0.45);
      lastFingers = fingers;
      const sound = audio.analysis();
      audio.update(dt, { poles, fingers, behaviour: blend.b, scene, aspect: engine.aspect });
      engine.frame({
        dt,
        time,
        scene,
        settings,
        poles,
        fingers,
        behaviour: { a: blend.a, b: blend.b, mix: blend.mix },
        audio: sound,
        gravity: settings.tilt ? tilt.vector() : { x: 0, y: -1, z: 0 }
      });
      if (!capture.recording && governor.sample(interval, dt)) {
        engine.setQuality({ particles: governor.particles, renderScale: governor.renderScale });
      }
      ui.update(dt, { fingers, behaviour: blend.b, fps, particles: engine.stats.particles, recording: capture.recording, autopilot: autoShown });
      updateAwake(now);
      if (!toldRepairs && engine.health.heals >= 3) {
        toldRepairs = true;
        ui.toast("The light keeps hitting a graphics problem on this device. Settings > Device check shows the details.", 8e3);
      }
      frames++;
      if (frames === 2) hook.ready = true;
      schedule();
    }
    function updateAwake(now) {
      const s = store.settings;
      const quietFor = Math.max(5 * 6e4, (s.idleSeconds + 60) * 1e3);
      const want = !document.hidden && (s.autopilot === "always" || capture.recording || now - personAt < quietFor);
      if (want !== awake) {
        awake = want;
        platform.keepAwake(want);
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        store.flush();
        updateAwake(performance.now());
      } else {
        last = performance.now();
        due = 0;
        personAt = last;
        updateAwake(last);
        schedule();
      }
    });
    addEventListener("pagehide", () => store.flush());
    updateAwake(performance.now());
    const hook = {
      version: VERSION,
      ready: false,
      test: TEST,
      store,
      engine,
      governor,
      pointers,
      keyboard,
      autopilot,
      tilt,
      audio,
      capture,
      platform,
      ui,
      actions,
      get frames() {
        return frames;
      },
      get fingers() {
        return lastFingers;
      },
      get behaviour() {
        return { ...blend };
      },
      get autoplay() {
        return autoShown;
      }
    };
    window.TACTILUME = hook;
    schedule();
  }
  try {
    boot();
  } catch (e) {
    console.error(e);
    showFatal("Tactilume could not start", String(e && e.message ? e.message : e));
  }
})();

</script>
