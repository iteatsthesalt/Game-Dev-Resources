[versions]
# Android Gradle Plugin 9 compiles Kotlin itself, so there is no separate Kotlin plugin.
agp = "9.5.1"
activity = "1.13.0"
core = "1.19.1"
webkit = "1.18.0"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
