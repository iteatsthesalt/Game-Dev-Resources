name: Pages

on:
  push:
    branches: [main]
    paths: ['Apps/Byways/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Apps/Byways
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Apps/Byways/package-lock.json
      - run: npm ci
      - run: node tools/build.js --target pwa
      - run: mkdir -p "$RUNNER_TEMP/_site/byways"
      - run: cp shells/pwa/landing/index.html "$RUNNER_TEMP/_site/index.html"
      - run: cp -R dist/pwa/. "$RUNNER_TEMP/_site/byways/"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
