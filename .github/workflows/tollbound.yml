name: Tollbound
on:
  push:
    paths: ['Games/Tollbound/**', '.github/workflows/tollbound.yml']
  pull_request:
    paths: ['Games/Tollbound/**', '.github/workflows/tollbound.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Games/Tollbound
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:full
      # The tracked page must be what src/ builds: the lead rebuilds it with npm run build in each integration commit.
      - run: npm run check
