name: 8-Way Sprite Rig
on:
  push:
    paths: ['Games/8-Way Sprite Rig/**', 'Games/Cinderdeep3D/src/vendor/**', '.github/workflows/sprite-rig.yml']
  pull_request:
    paths: ['Games/8-Way Sprite Rig/**', 'Games/Cinderdeep3D/src/vendor/**', '.github/workflows/sprite-rig.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Games/8-Way Sprite Rig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
